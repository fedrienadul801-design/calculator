<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<style>
:root{box-sizing:border-box;--bg:#0a1230;--key:#162350;--fg:#f2f2f2;--or:#2f80ff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:16px}
.disp{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:8px 8px 20px;overflow:hidden}
.expr{color:#888;font-size:22px;min-height:28px;word-break:break-all;text-align:right}
.res{font-size:64px;font-weight:600;line-height:1.1;word-break:break-all;text-align:right}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{border:0;border-radius:22px;background:var(--key);color:var(--fg);font-size:28px;font-weight:600;height:clamp(60px,10vh,92px);cursor:pointer;font-family:inherit}
button:active{filter:brightness(1.5)}
.o{color:var(--or)}
.eq{background:var(--or);color:#fff}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.ov.show{display:flex}
.card{background:#121d44;border-radius:26px;padding:26px 22px;max-width:360px;width:100%;text-align:center;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.card h2{margin:6px 0 8px;font-size:22px}
.card p{margin:0 0 14px;color:#aaa;font-size:15px;line-height:1.4}
.price{font-size:40px;font-weight:700;color:var(--or);margin:4px 0 2px}
.price small{font-size:16px;color:#aaa;font-weight:500}
.card button{display:block;width:100%;height:52px;font-size:18px;margin-top:10px;border-radius:16px}
.card a{display:block;text-decoration:none;background:var(--or);color:#fff;font-weight:600;font-size:18px;padding:14px;border-radius:16px;margin-top:10px}
.lock{font-size:46px}
.roll{font-size:84px;display:inline-block;animation:dance .6s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-12deg) translateY(0)}to{transform:rotate(12deg) translateY(-14px)}}
.meme{background:linear-gradient(135deg,#00c6ff,#0057ff);border-radius:18px;padding:18px 10px;margin-bottom:6px}
.meme b{display:block;font-size:26px;color:#fff;text-shadow:2px 2px 0 #000;letter-spacing:1px;text-transform:uppercase}
.meme span{display:block;color:#fff;font-size:14px;margin-top:6px;text-shadow:1px 1px 0 #000}
</style>
</head>
<body>
<div class="app">
  <div class="disp"><div class="expr" id="expr"></div><div class="res" id="res">0</div></div>
  <div class="pad" id="pad">
    <button class="o" data-k="AC">AC</button>
    <button class="o" data-k="DEL">⌫</button>
    <button class="o" data-k="%">%</button>
    <button class="o" data-k="/">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="o" data-k="*">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="o" data-k="-">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="o" data-k="+">+</button>
    <button class="o" data-k="SIGN">±</button>
    <button data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=">=</button>
  </div>
</div>

<div class="ov" id="pay"><div class="card">
  <div class="lock">🔒</div>
  <h2>Calculator Premium</h2>
  <p>Your answer is ready, but results are locked. Subscribe to unlock unlimited equals.</p>
  <div class="price">RM 150 <small>/ week</small></div>
  <p>Cancel anytime* <br><small>*you can't</small></p>
  <button class="eq" id="buy">Purchase</button>
  <button id="no">Maybe later</button>
</div></div>

<div class="ov" id="rick"><div class="card">
  <div class="meme">
    <div class="roll">🕺</div>
    <b>Never gonna give you up</b>
    <span>You just got Rickrolled 😎</span>
  </div>
  <p>Relax, no money was taken. It's a prank!</p>
  <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener">▶ Watch the full video</a>
  <button id="close">Close</button>
</div></div>

<script>
var s="",expr=document.getElementById("expr"),res=document.getElementById("res");
var ops={"/":"÷","*":"×","-":"−","+":"+"};
function show(){
  var t=s.replace(/[\/*\-+]/g,function(c){return " "+ops[c]+" "});
  expr.textContent=t;
  var m=s.match(/[\d.]+$/);
  res.textContent=s?(m?m[0]:"0"):"0";
}
function press(k){
  if(k==="AC")s="";
  else if(k==="DEL")s=s.slice(0,-1);
  else if(k==="="){ if(s){document.getElementById("pay").classList.add("show")} return; }
  else if(k==="SIGN"){ s=s.replace(/(-?[\d.]+)$/,function(x){return x[0]==="-"?x.slice(1):"-"+x}) }
  else if(ops[k]||k==="%"){ if(s&&!/[\/*\-+%]$/.test(s))s+=k; else if(s&&ops[k])s=s.slice(0,-1)+k; }
  else if(k==="."){ var m=s.match(/[\d.]*$/)[0]; if(m.indexOf(".")<0)s+=m?".":"0."; }
  else s+=k;
  show();
}
document.getElementById("pad").addEventListener("click",function(e){var b=e.target.closest("button");if(b)press(b.dataset.k)});
document.getElementById("buy").onclick=function(){
  document.getElementById("pay").classList.remove("show");
  document.getElementById("rick").classList.add("show");
};
document.getElementById("no").onclick=function(){document.getElementById("pay").classList.remove("show")};
document.getElementById("close").onclick=function(){document.getElementById("rick").classList.remove("show")};
</script>
</body>
</html>
