<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<style>
:root{--bg:#0a1230;--key:#162350;--fg:#f2f2f2;--ac:#2f80ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.disp{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:8px 8px 20px;overflow:hidden}
.expr{color:#8d9bc7;font-size:22px;min-height:28px;word-break:break-all;text-align:right}
.res{font-size:64px;font-weight:600;line-height:1.1;word-break:break-all;text-align:right}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{border:0;border-radius:22px;background:var(--key);color:var(--fg);font-size:28px;font-weight:600;height:clamp(60px,10vh,92px);cursor:pointer;font-family:inherit}
button:active{filter:brightness(1.5)}
.o{color:#6aa5ff}
.eq{background:var(--ac);color:#fff}
</style>
</head>
<body>
<div class="app">
  <div class="disp"><div class="expr" id="expr"></div><div class="res" id="res">0</div></div>
  <div class="pad" id="pad">
    <button class="o" data-k="AC">AC</button>
    <button class="o" data-k="DEL">⌫</button>
    <button class="o" data-k="%">%</button>
    <button class="o" data-k="/">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="o" data-k="*">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="o" data-k="-">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="o" data-k="+">+</button>
    <button class="o" data-k="SIGN">±</button>
    <button data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=">=</button>
  </div>
</div>
<script>
var s="",done=false,expr=document.getElementById("expr"),res=document.getElementById("res");
var sym={"/":"÷","*":"×","-":"−","+":"+"};

function show(){
  expr.textContent=s.replace(/[\/*\-+]/g,function(c){return " "+sym[c]+" "});
  var m=s.match(/-?[\d.]+%?$/);
  res.textContent=s?(m?m[0]:"0"):"0";
}

function calc(){
  var e=s.replace(/(\d+\.?\d*)%/g,"($1/100)");
  if(/[\/*\-+]$/.test(e))e=e.slice(0,-1);
  if(!/^[\d.()\/*\-+]+$/.test(e))return null;
  try{
    var v=Function('"use strict";return ('+e+')')();
    if(!isFinite(v))return "Error";
    return String(parseFloat(v.toPrecision(12)));
  }catch(x){return "Error"}
}

function press(k){
  if(k==="AC"){s="";done=false}
  else if(k==="DEL"){s=done?"":s.slice(0,-1);done=false}
  else if(k==="="){
    if(!s)return;
    var r=calc();
    if(r===null)return;
    expr.textContent=s.replace(/[\/*\-+]/g,function(c){return " "+sym[c]+" "})+" =";
    res.textContent=r;
    s=r==="Error"?"":r;done=true;
    return;
  }
  else if(k==="SIGN"){
    s=s.replace(/(-?[\d.]+)$/,function(x){return x[0]==="-"?x.slice(1):"-"+x});
    done=false;
  }
  else if(sym[k]){
    if(!s){if(k==="-")s="-";}
    else if(/[\/*\-+]$/.test(s)&&s.length>1)s=s.slice(0,-1)+k;
    else if(!/[\/*\-+]$/.test(s))s+=k;
    done=false;
  }
  else if(k==="%"){
    if(/[\d.]$/.test(s))s+="%";
    done=false;
  }
  else if(k==="."){
    if(done){s="";done=false}
    var m=s.match(/[\d.]*$/)[0];
    if(m.indexOf(".")<0)s+=m?".":"0.";
  }
  else{
    if(done){s="";done=false}
    if(/%$/.test(s))return;
    s+=k;
  }
  show();
}

document.getElementById("pad").addEventListener("click",function(e){
  var b=e.target.closest("button");if(b)press(b.dataset.k);
});
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(/^[0-9.+\-*\/%]$/.test(k))press(k);
  else if(k==="Enter"||k==="="){e.preventDefault();press("=")}
  else if(k==="Backspace")press("DEL");
  else if(k==="Escape")press("AC");
});
</script>
</body>
</html>
